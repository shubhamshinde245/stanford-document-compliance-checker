[project]
name = "stanford-document-compliance-checker"
version = "0.1.0"
description = "Rank uploaded procedures against parked SANS policy embeddings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "playwright>=1.49.0",
    "apscheduler>=3.10.4,<4",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pypdf>=6.18.0",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:backend.*"]
